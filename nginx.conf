user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Pages, CSS and JS: browsers must check for a new version before using a saved copy
        location ~* \.(html|css|js|json)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Images and fonts: fine to reuse for a day
        location ~* \.(png|jpg|jpeg|webp|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Extensionless page URLs (/fire-damage-restoration)
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri.html $uri/ =404;
        }

        # Health check endpoint for Railway
        location /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
