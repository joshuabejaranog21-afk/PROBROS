<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pro Bros — Gestor de Imágenes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f4f5; color: #18181b; min-height: 100vh; }

    header { background: #18181b; color: #fff; padding: 18px 32px; display: flex; align-items: center; gap: 14px; }
    header h1 { font-size: 20px; font-weight: 600; }
    header span { font-size: 13px; color: #a1a1aa; }

    .flash { padding: 12px 24px; font-size: 14px; font-weight: 500; }
    .flash.success { background: #dcfce7; color: #166534; border-left: 4px solid #22c55e; }
    .flash.error   { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }

    .tabs { display: flex; gap: 4px; padding: 24px 32px 0; border-bottom: 1px solid #e4e4e7; background: #fff; }
    .tab { padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px 8px 0 0;
           border: 1px solid transparent; border-bottom: none; color: #71717a; transition: all .15s; }
    .tab.active { background: #f4f4f5; border-color: #e4e4e7; color: #18181b; margin-bottom: -1px; }
    .tab:hover:not(.active) { color: #18181b; }

    .page-section { display: none; padding: 32px; }
    .page-section.active { display: block; }

    .section-title { font-size: 13px; font-weight: 600; color: #71717a; letter-spacing: .08em;
                     text-transform: uppercase; margin-bottom: 20px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

    .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; overflow: hidden;
            transition: box-shadow .2s; }
    .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.08); }

    .card-preview { aspect-ratio: 4/3; background: #e4e4e7; position: relative; overflow: hidden; }
    .card-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-preview .empty { position: absolute; inset: 0; display: flex; flex-direction: column;
                           align-items: center; justify-content: center; gap: 8px; color: #a1a1aa; }
    .card-preview .empty svg { opacity: .4; }
    .card-preview .empty span { font-size: 12px; }
    .badge { position: absolute; top: 10px; right: 10px; padding: 3px 8px; border-radius: 20px;
             font-size: 11px; font-weight: 600; letter-spacing: .06em; }
    .badge.filled { background: #22c55e; color: #fff; }
    .badge.empty  { background: #e4e4e7; color: #71717a; }

    .card-body { padding: 14px 16px 16px; }
    .card-label { font-size: 14px; font-weight: 500; margin-bottom: 4px; line-height: 1.3; }
    .card-file  { font-size: 11px; color: #a1a1aa; margin-bottom: 14px; font-family: monospace; }

    .upload-form { display: flex; flex-direction: column; gap: 8px; }
    input[type="file"] { font-size: 12px; color: #52525b; cursor: pointer; width: 100%;
                         border: 1px dashed #d4d4d8; border-radius: 6px; padding: 8px;
                         background: #fafafa; }
    input[type="file"]:hover { border-color: #a1a1aa; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
           padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500;
           cursor: pointer; border: none; transition: all .15s; width: 100%; }
    .btn-primary { background: #18181b; color: #fff; }
    .btn-primary:hover { background: #27272a; }
    .btn-danger  { background: #fee2e2; color: #991b1b; }
    .btn-danger:hover { background: #fecaca; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn-row .btn { flex: 1; }
  </style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
    <path d="M21 15l-5-5L5 21"/>
  </svg>
  <div>
    <h1>Pro Bros — Gestor de Imágenes</h1>
    <span>Sube las fotos para cada sección del sitio</span>
  </div>
</header>

<div th:if="${success}" class="flash success" th:text="${success}"></div>
<div th:if="${error}"   class="flash error"   th:text="${error}"></div>

<!-- Tabs -->
<div class="tabs">
  <div th:each="entry, stat : ${slotsByPage}"
       th:text="${entry.key}"
       th:classappend="${stat.first} ? 'active' : ''"
       th:attr="data-page=${entry.key}"
       class="tab">
  </div>
</div>

<!-- Sections -->
<div th:each="entry, stat : ${slotsByPage}"
     th:id="'section-' + ${entry.key}"
     th:classappend="${stat.first} ? 'active' : ''"
     class="page-section">

  <p class="section-title" th:text="${entry.key} + ' — ' + ${entry.value.size()} + ' slots'"></p>

  <div class="grid">
    <div class="card" th:each="slot : ${entry.value}">

      <div class="card-preview">
        <img th:if="${slot.filled}"
             th:src="'/site-images/' + ${slot.imageFilename}"
             th:alt="${slot.label}"/>
        <div th:unless="${slot.filled}" class="empty">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>Sin imagen</span>
        </div>
        <span th:if="${slot.filled}"  class="badge filled">✓ OK</span>
        <span th:unless="${slot.filled}" class="badge empty">Vacío</span>
      </div>

      <div class="card-body">
        <div class="card-label" th:text="${slot.label}"></div>
        <div class="card-file" th:text="${slot.pageFile}"></div>

        <form th:action="'/upload/' + ${slot.id}" method="post" enctype="multipart/form-data"
              class="upload-form">
          <input type="file" name="file" accept="image/*" required/>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              Subir
            </button>
            <form th:if="${slot.filled}" th:action="'/remove/' + ${slot.id}" method="post"
                  style="flex:1;display:flex;">
              <button type="submit" class="btn btn-danger"
                      onclick="return confirm('¿Eliminar esta imagen?')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.4" stroke-linecap="round">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                  <path d="M10 11v6M14 11v6"/>
                </svg>
                Quitar
              </button>
            </form>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<script>
  function switchTab(page) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
    document.querySelector('.tab[data-page="' + page + '"]').classList.add('active');
    document.getElementById('section-' + page).classList.add('active');
  }
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.getAttribute('data-page')));
  });
</script>
</body>
</html>
